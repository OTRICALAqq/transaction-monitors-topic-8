<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Виртуальная доска Мониторы транзакций" viewBox="0 0 1440 1000" id="diagram"><rect width="100%" height="100%" fill="#ffffff"/><g class="node" id="n1" data-text="Мониторы транзакций"><text x="42" y="66.100" text-anchor="start" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#172C45"><tspan x="42" dy="0">Мониторы транзакций</tspan></text></g><g class="node" id="n2" data-text="Тема 8   •   Распределённые и облачные вычисления   •   От запроса к согласованному результату"><text x="44" y="113.120" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172C45"><tspan x="44" dy="0">Тема 8 • Распределённые и облачные вычисления • От запроса к согласованному результату</tspan></text></g><g class="node" id="n3" data-text=""><rect x="40" y="150" width="430" height="260" rx="12" fill="#EFF5FC" stroke="#D4DCE5" stroke-width="1.2"/><text x="255.0" y="286.120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172C45"><tspan x="255.0" dy="0"></tspan></text></g><g class="node" id="n4" data-text="01  Назначение и ACID"><text x="64" y="187.980" text-anchor="start" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172C45"><tspan x="64" dy="0">01 Назначение и ACID</tspan></text></g><g class="node" id="n5" data-text="Монитор организует обработку запросов
и согласованное завершение операций.

A — всё или ничего
C — соблюдение ограничений
I — изоляция параллельной работы
D — сохранность фиксации"><text x="64" y="243.030" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172C45"><tspan x="64" dy="0">Монитор организует обработку запросов</tspan><tspan x="64" dy="21.25">и согласованное завершение операций.</tspan><tspan x="64" dy="21.25"></tspan><tspan x="64" dy="21.25">A — всё или ничего</tspan><tspan x="64" dy="21.25">C — соблюдение ограничений</tspan><tspan x="64" dy="21.25">I — изоляция параллельной работы</tspan><tspan x="64" dy="21.25">D — сохранность фиксации</tspan></text></g><g class="node" id="n6" data-text=""><rect x="505" y="150" width="430" height="260" rx="12" fill="#F0F7F4" stroke="#D4DCE5" stroke-width="1.2"/><text x="720.0" y="286.120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172C45"><tspan x="720.0" dy="0"></tspan></text></g><g class="node" id="n7" data-text="02  Участники X/Open DTP"><text x="529" y="187.980" text-anchor="start" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172C45"><tspan x="529" dy="0">02 Участники X/Open DTP</tspan></text></g><g class="node" id="n8" data-text="AP — прикладная программа
Выполняет бизнес-операции

TM — менеджер транзакций
Координирует общий результат

RM — менеджер ресурсов
Хранит данные и локальное состояние"><text x="529" y="232.405" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172C45"><tspan x="529" dy="0">AP — прикладная программа</tspan><tspan x="529" dy="21.25">Выполняет бизнес-операции</tspan><tspan x="529" dy="21.25"></tspan><tspan x="529" dy="21.25">TM — менеджер транзакций</tspan><tspan x="529" dy="21.25">Координирует общий результат</tspan><tspan x="529" dy="21.25"></tspan><tspan x="529" dy="21.25">RM — менеджер ресурсов</tspan><tspan x="529" dy="21.25">Хранит данные и локальное состояние</tspan></text></g><g class="node" id="n9" data-text=""><rect x="970" y="150" width="430" height="260" rx="12" fill="#F7F3EC" stroke="#D4DCE5" stroke-width="1.2"/><text x="1185.0" y="286.120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172C45"><tspan x="1185.0" dy="0"></tspan></text></g><g class="node" id="n10" data-text="03  Двухфазная фиксация"><text x="994" y="187.980" text-anchor="start" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172C45"><tspan x="994" dy="0">03 Двухфазная фиксация</tspan></text></g><g class="node" id="n11" data-text="1. PREPARE — опрос участников
Участники сохраняют готовность

2. COMMIT или ROLLBACK
Координатор сообщает общее решение

COMMIT принимается после готовности
всех необходимых участников"><text x="994" y="232.405" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172C45"><tspan x="994" dy="0">1. PREPARE — опрос участников</tspan><tspan x="994" dy="21.25">Участники сохраняют готовность</tspan><tspan x="994" dy="21.25"></tspan><tspan x="994" dy="21.25">2. COMMIT или ROLLBACK</tspan><tspan x="994" dy="21.25">Координатор сообщает общее решение</tspan><tspan x="994" dy="21.25"></tspan><tspan x="994" dy="21.25">COMMIT принимается после готовности</tspan><tspan x="994" dy="21.25">всех необходимых участников</tspan></text></g><g class="node" id="n12" data-text=""><rect x="40" y="440" width="430" height="260" rx="12" fill="#FAF0EF" stroke="#D4DCE5" stroke-width="1.2"/><text x="255.0" y="576.120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172C45"><tspan x="255.0" dy="0"></tspan></text></g><g class="node" id="n13" data-text="04  Отказ и восстановление"><text x="64" y="477.980" text-anchor="start" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172C45"><tspan x="64" dy="0">04 Отказ и восстановление</tspan></text></g><g class="node" id="n14" data-text="Тайм-аут не доказывает откат.

После PREPARE участник может ждать
решение, удерживая блокировки.

Решение COMMIT записывается устойчиво.
После сбоя оно повторно доставляется.

Классический 2PC может блокироваться."><text x="64" y="511.780" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172C45"><tspan x="64" dy="0">Тайм-аут не доказывает откат.</tspan><tspan x="64" dy="21.25"></tspan><tspan x="64" dy="21.25">После PREPARE участник может ждать</tspan><tspan x="64" dy="21.25">решение, удерживая блокировки.</tspan><tspan x="64" dy="21.25"></tspan><tspan x="64" dy="21.25">Решение COMMIT записывается устойчиво.</tspan><tspan x="64" dy="21.25">После сбоя оно повторно доставляется.</tspan><tspan x="64" dy="21.25"></tspan><tspan x="64" dy="21.25">Классический 2PC может блокироваться.</tspan></text></g><g class="node" id="n15" data-text=""><rect x="505" y="440" width="430" height="260" rx="12" fill="#EFF5FC" stroke="#D4DCE5" stroke-width="1.2"/><text x="720.0" y="576.120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172C45"><tspan x="720.0" dy="0"></tspan></text></g><g class="node" id="n16" data-text="05  Перевод 1 000 рублей"><text x="529" y="477.980" text-anchor="start" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172C45"><tspan x="529" dy="0">05 Перевод 1 000 рублей</tspan></text></g><g class="node" id="n17" data-text="Два ресурса с общей координацией

До:     А = 10 000     Б = 5 000
COMMIT: А = 9 000      Б = 6 000
Откат:   А = 10 000     Б = 5 000

Итоговая сумма — 15 000 рублей.
Повтор запроса проверяется по ID.
Пример условный, без комиссии."><text x="529" y="511.780" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172C45"><tspan x="529" dy="0">Два ресурса с общей координацией</tspan><tspan x="529" dy="21.25"></tspan><tspan x="529" dy="21.25">До: А = 10 000 Б = 5 000</tspan><tspan x="529" dy="21.25">COMMIT: А = 9 000 Б = 6 000</tspan><tspan x="529" dy="21.25">Откат: А = 10 000 Б = 5 000</tspan><tspan x="529" dy="21.25"></tspan><tspan x="529" dy="21.25">Итоговая сумма — 15 000 рублей.</tspan><tspan x="529" dy="21.25">Повтор запроса проверяется по ID.</tspan><tspan x="529" dy="21.25">Пример условный, без комиссии.</tspan></text></g><g class="node" id="n18" data-text=""><rect x="970" y="440" width="430" height="260" rx="12" fill="#F0F7F4" stroke="#D4DCE5" stroke-width="1.2"/><text x="1185.0" y="576.120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172C45"><tspan x="1185.0" dy="0"></tspan></text></g><g class="node" id="n19" data-text="06  Реализации и облако"><text x="994" y="477.980" text-anchor="start" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172C45"><tspan x="994" dy="0">06 Реализации и облако</tspan></text></g><g class="node" id="n20" data-text="Oracle Tuxedo — платформа и ATMI
IBM CICS — задачи и единицы работы
MSDTC — координатор транзакций

Сага — локальные шаги и компенсации
Outbox — запись данных и события
в одной локальной транзакции

Выбор зависит от требуемых гарантий."><text x="994" y="511.780" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172C45"><tspan x="994" dy="0">Oracle Tuxedo — платформа и ATMI</tspan><tspan x="994" dy="21.25">IBM CICS — задачи и единицы работы</tspan><tspan x="994" dy="21.25">MSDTC — координатор транзакций</tspan><tspan x="994" dy="21.25"></tspan><tspan x="994" dy="21.25">Сага — локальные шаги и компенсации</tspan><tspan x="994" dy="21.25">Outbox — запись данных и события</tspan><tspan x="994" dy="21.25">в одной локальной транзакции</tspan><tspan x="994" dy="21.25"></tspan><tspan x="994" dy="21.25">Выбор зависит от требуемых гарантий.</tspan></text></g><g class="node" id="n21" data-text=""><rect x="40" y="735" width="895" height="170" rx="12" fill="#F4F6F9" stroke="#D4DCE5" stroke-width="1.2"/><text x="487.5" y="826.120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172C45"><tspan x="487.5" dy="0"></tspan></text></g><g class="node" id="n22" data-text="07  Вопросы для самопроверки"><text x="67" y="770.480" text-anchor="start" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172C45"><tspan x="67" dy="0">07 Вопросы для самопроверки</tspan></text></g><g class="node" id="n23" data-text="Чем монитор отличается от средства наблюдения?
Почему PREPARE ещё не означает успешную фиксацию?
Что делать, если ответ клиенту потерян после COMMIT?
Когда вместо общей ACID-транзакции уместна сага?"><text x="67" y="810.835" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#172C45"><tspan x="67" dy="0">Чем монитор отличается от средства наблюдения?</tspan><tspan x="67" dy="23.75">Почему PREPARE ещё не означает успешную фиксацию?</tspan><tspan x="67" dy="23.75">Что делать, если ответ клиенту потерян после COMMIT?</tspan><tspan x="67" dy="23.75">Когда вместо общей ACID-транзакции уместна сага?</tspan></text></g><g class="node" id="n24" data-text=""><rect x="970" y="735" width="430" height="170" rx="12" fill="#F7F3EC" stroke="#D4DCE5" stroke-width="1.2"/><text x="1185.0" y="826.120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172C45"><tspan x="1185.0" dy="0"></tspan></text></g><g class="node" id="n25" data-text="08  Главная связь"><text x="992" y="770.480" text-anchor="start" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172C45"><tspan x="992" dy="0">08 Главная связь</tspan></text></g><g class="node" id="n26" data-text="Прикладные правила + TM + RM
→ согласованная операция

2PC обеспечивает атомарный итог,
а изоляцию проверяют отдельно."><text x="992" y="803.620" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172C45"><tspan x="992" dy="0">Прикладные правила + TM + RM</tspan><tspan x="992" dy="22.5">→ согласованная операция</tspan><tspan x="992" dy="22.5"></tspan><tspan x="992" dy="22.5">2PC обеспечивает атомарный итог,</tspan><tspan x="992" dy="22.5">а изоляцию проверяют отдельно.</tspan></text></g><g class="node" id="n27" data-text="Источники: IBM CICS; Oracle Tuxedo; Microsoft MS-DTCO; PostgreSQL; Gray и Lamport; AWS. Подробные ссылки — в отчёте."><text x="47" y="955.760" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#52657C"><tspan x="47" dy="0">Источники: IBM CICS; Oracle Tuxedo; Microsoft MS-DTCO; PostgreSQL; Gray и Lamport; AWS. Подробные ссылки — в отчёте.</tspan></text></g></svg>